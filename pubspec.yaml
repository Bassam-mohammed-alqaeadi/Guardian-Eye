name: guardian_ai
description: Guardian AI — AI-Powered Family Safety & Parental Control Platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  
  # Navigation
  go_router: ^13.2.0
  
  # Data & Networking
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  shared_preferences: ^2.2.3
  
  # Dependency Injection
  get_it: ^7.6.7
  
  # Localization
  intl: ^0.20.2
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1
  
  # Utils
  logger: ^2.3.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  path: ^1.9.1
  sqflite: ^2.4.2
  flutter_secure_storage: ^10.0.0

  # Reports & Export (FS-009)
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.1.4
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  mobile_scanner: ^7.1.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^20.0.0
  workmanager: ^0.9.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.3.6
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2
  firebase_analytics: ^12.0.2
  firebase_crashlytics: ^5.0.2
  firebase_remote_config: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/translations/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/guardian_eye_icon.png
  remove_alpha_ios: true
